<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Swaps">
<meta name="theme-color" content="#FBF2D5">
<link rel="apple-touch-icon" href="apple-touch-icon-n8.png">
<link rel="icon" type="image/png" href="icon-n8.png">
<title>Meal Swaps</title>
<style>
  /* Licensed Nomad8 webfonts. Drop the files into fonts/ and these take over;
     until then the stacks below fall back to the closest native faces. */
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Medium.otf") format("opentype");font-weight:400 500;font-style:normal;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-MediumItalic.otf") format("opentype");font-weight:400 500;font-style:italic;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

  :root{
    /* Nomad8 tokens */
    --n8-ink:#082B35; --n8-ink-80:#3a5259; --n8-ink-60:#6b7d82; --n8-ink-20:#cdd4d6;
    --n8-cream:#FBF2D5; --n8-paper:#FFFFFF; --n8-border:#E6E4DF;
    --n8-green:#97C93D; --n8-orange:#E97A52; --n8-yellow:#F5B915;
    --n8-wash-green:#DDECC6; --n8-wash-yellow:#FCF2D3; --n8-wash-pink:#FDEEEB;
    --n8-wash-blue:#E0F3F7; --n8-wash-sage:#E9F5D9; --n8-wash-blush:#F9EAE7;
    --n8-font-serif:"Feijoa","Iowan Old Style",Charter,Palatino,Georgia,serif;
    --n8-font-ui:"GT Walsheim","Avenir Next",Avenir,-apple-system,"Helvetica Neue",Arial,sans-serif;

    --bg:var(--n8-cream); --bg2:var(--n8-paper); --card:var(--n8-paper);
    --line:var(--n8-border); --text:var(--n8-ink); --muted:var(--n8-ink-80); --muted2:var(--n8-ink-60);
    --accent:var(--n8-ink);
    /* macro colours — brand accents darkened to hold 4.5:1 on paper */
    --cal:#1E6B7D; --pro:#5C8512; --fat:#C0521F; --carb:#8A6A08;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--n8-font-serif);
    line-height:1.5; padding-bottom:48px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px}
  header{padding:max(20px,env(safe-area-inset-top)) 0 6px}
  h1{font-family:var(--n8-font-serif); font-size:32px; font-weight:500; letter-spacing:0;
    margin:8px 0 4px; display:flex; align-items:center; gap:12px}
  .logo{width:34px; height:34px; flex:0 0 auto}
  .sub{color:var(--muted); font-size:15px; margin:0 0 14px}

  /* targets — flat sage panel */
  .targets{background:var(--n8-wash-green); border:none; border-radius:0; padding:18px 18px 20px; margin:2px 0 18px}
  .targets h2{font-family:var(--n8-font-serif); font-size:22px; text-transform:none; letter-spacing:0;
    color:var(--n8-ink); margin:0 0 3px; font-weight:500}
  .targets-sub{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin:0 0 14px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .stat{text-align:center}
  .stat b{display:block; font-family:var(--n8-font-serif); font-size:26px; font-weight:700; letter-spacing:-.01em}
  .stat span{font-family:var(--n8-font-ui); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
  .stat.cal b{color:var(--cal)} .stat.pro b{color:var(--pro)}
  .stat.fat b{color:var(--fat)} .stat.carb b{color:var(--carb)}

  /* meal card — flat paper rectangle, no shadow */
  .meal{background:var(--card); border:1px solid var(--line); border-radius:0; margin-bottom:10px; overflow:hidden}
  .meal-head{display:flex; align-items:flex-start; gap:13px; padding:15px 16px}
  .icon{flex:0 0 auto; width:44px; height:44px; border-radius:0; display:grid; place-items:center; font-size:22px}
  .meal-body{flex:1; min-width:0}
  .meal-kicker{display:flex; align-items:center; gap:8px; margin-bottom:2px}
  .meal-kicker .name{font-family:var(--n8-font-serif); font-size:20px; font-weight:500; letter-spacing:0}
  .badge{font-family:var(--n8-font-ui); font-size:11px; font-weight:400; color:var(--n8-ink);
    background:var(--n8-wash-green); padding:3px 10px; border-radius:999px}
  .badge.none{color:var(--muted2); background:transparent; padding:0}
  .macros{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
  .m-cal{color:var(--cal)} .m-pro{color:var(--pro)} .m-fat{color:var(--fat)} .m-carb{color:var(--carb)}

  /* folded meals (breakfast is made as one bowl) */
  .items{font-size:15px; color:var(--n8-ink-80); margin-top:2px}
  .meal.swappable .meal-head{cursor:pointer}
  .meal-head .chev{margin-top:11px}
  .meal.open .meal-head .chev{transform:rotate(180deg)}
  .fold-swaps{display:none; padding:4px 16px 12px; border-top:1px solid var(--line)}
  .meal.open .fold-swaps{display:block}

  /* ingredient rows */
  .ings{border-top:1px solid var(--line)}
  .ing{border-bottom:1px solid var(--line); padding:0 16px}
  .ing:last-child{border-bottom:none}
  .ing-line{display:flex; gap:11px; align-items:center; padding:11px 0}
  .ing.swappable .ing-line{cursor:pointer}
  .ing-em{flex:0 0 auto; font-size:19px; width:24px; text-align:center}
  .ing-txt{flex:1; min-width:0}
  .ing-name{font-size:15.5px; font-weight:500}
  .ing-sub{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .chev{flex:0 0 auto; color:var(--muted2); transition:transform .18s ease-out; font-size:11px}
  .ing.open .chev{transform:rotate(180deg)}

  /* swap list under an ingredient */
  .swaps{display:none; padding:0 0 12px 35px}
  .ing.open .swaps{display:block}
  .swaps-label{font-family:var(--n8-font-ui); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted2); font-weight:700; padding:2px 0 6px}
  .swap{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line)}
  .swap-em{flex:0 0 auto; font-size:17px; width:22px; text-align:center}
  .swap-txt{flex:1; min-width:0}
  .swap-name{font-size:14.5px; font-weight:500}
  .swap-d{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}

  a{color:var(--n8-ink); text-decoration:underline; text-underline-offset:3px}
  a:hover{color:var(--pro)}

  footer{font-family:var(--n8-font-ui); color:var(--muted2); font-size:12px; text-align:center; padding:22px 8px; line-height:1.6}
  footer .n8mark{display:block; width:74px; margin:0 auto 12px; opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="icon-n8.png" alt="">Meal Swaps</h1>
  </header>
</div>
<div class="wrap">
  <div class="targets">
    <h2>Day Targets</h2>
    <div class="stats" id="stats"></div>
  </div>
  <div id="meals"></div>
  <footer id="foot"></footer>
</div>

<script>
/* ---------- version (keep in sync with version.txt on deploy) ---------- */
const APP_VERSION = '2026-09-11.2';

/* ---------- day targets (verbatim from the guide: "2. BL nutrition updates (Aug 2026)") ---------- */
const TARGETS = {cal:1693, p:135, f:56, c:145, fib:28};

/* ---------- food library ----------
   v = [kcal, protein g, fat g, available carb g] per 100 g, from the NZ Food
   Composition Database (product label where NZ has no entry) — pinned by
   nz-reference.json in ../mealapp, verified by evals.js. Never guess.
   u = unit foods: n/p name, g grams per unit, step rounding, min/max counts.
   ml = measured in millilitres. max = largest sensible swap portion in grams. */
const FOODS = {
  /* rawP = raw protein per 100 g, from the pinned nz-reference *_raw entries.
     Raw weight is derived, not guessed: protein is conserved when meat is cooked
     (water/fat leave, protein stays), so raw g = cooked g × cooked-protein ÷ rawP.
     Prawns have no raw entry (bought cooked), so they show cooked only. */
  chicken_cooked: {l:'chicken (cooked)',      e:'🍗', v:[138.9,28.2,2.73,0.0], rawP:22.5},  // chicken_raw
  beef_cooked:    {l:'lean beef (cooked)',    e:'🥩', v:[188.8,30.2,7.48,0.0], rawP:20.4},  // beef_raw
  pork_cooked:    {l:'pork loin (cooked)',    e:'🐖', v:[177.1,29.4,6.5,0.0],  rawP:23.2},  // pork_raw
  fish_cooked:    {l:'fish (cooked)',         e:'🐟', v:[115.7,25.2,1.5,0.0],  rawP:20.3},  // fish_raw
  prawns_cooked:  {l:'prawns (cooked)',       e:'🍤', v:[104.2,23.7,0.9,0.0]},
  /* tinned tuna is eaten as it comes out of the tin — drained values, no raw weight.
     NZ FOODfiles has no olive-oil-specific tuna, so this is its "canned in assorted oils" row. */
  tuna_oil:       {l:'tinned tuna in olive oil (drained)', e:'🐟', v:[174.7,26.4,7.6,0.0], max:200},

  /* rawC = raw/dry available-carb per 100 g. Available-carb is conserved when a carb
     cooks (only water changes), so raw/dry g = cooked g × cooked-carb ÷ rawC.
     dry:true → weighed dry as a grain (rice, pasta); else raw veg (kumara, pumpkin).
     kumara/pumpkin: NZ FoodFiles raw entries. rice/pasta: NZ retail labels. */
  rice_cooked:    {l:'rice (cooked)',         e:'🍚', v:[132.4,2.78,0.4,28.7], rawC:79,   dry:true},
  kumara_cooked:  {l:'kumara (cooked)',       e:'🍠', v:[86.8,1.25,0.21,18.8], rawC:18.8},
  pumpkin_cooked: {l:'pumpkin (cooked)',      e:'🎃', v:[42.8,1.12,0.42,7.05], rawC:6.7},
  potato_cooked:  {l:'potato (cooked)',       e:'🥔', v:[54.5,1.67,0.1,10.8], rawC:12.8, max:400},
  pasta_cooked:   {l:'pasta (cooked)',        e:'🍝', v:[135.3,5.05,0.8,25.4], rawC:72.5, dry:true},
  pita_wholemeal: {l:'wholemeal pita',        e:'🫓', v:[246.2,10.1,2.24,41.9], u:{n:'wholemeal pita',p:'wholemeal pitas',g:85}},
  spinach_wrap:   {l:'low carb spinach wrap', e:'🌯', v:[181.7,9.83,7.33,11.17], u:{n:'low carb spinach wrap (Rebel)',p:'low carb spinach wraps (Rebel)',g:60}},
  farrahs_tortilla:{l:"Farrah's low carb tortilla", e:'🌮', v:[241.4,8.0,7.7,24.7], u:{n:"Farrah's low carb tortilla",p:"Farrah's low carb tortillas",g:24}},

  avocado:        {l:'avocado',               e:'🥑', v:[218.0,1.78,22.7,0.08], max:110},
  feta:           {l:'feta',                  e:'🧀', v:[279.6,16.9,23.4,1.1], max:60},
  mayo_lite:      {l:'lite mayo / Perinaise', e:'🥄', v:[284.4,0.52,21.2,23.2], max:45},

  banana:         {l:'banana',                e:'🍌', v:[94.9,1.03,0.3,20.8], u:{n:'medium banana',p:'medium bananas',g:120}},
  apple:          {l:'apple',                 e:'🍎', v:[50.9,0.21,0.3,10.7], u:{n:'medium apple',p:'medium apples',g:130}},
  mandarin:       {l:'mandarin',              e:'🍊', v:[40.9,0.91,0.2,8.11], u:{n:'mandarin',g:70,max:4}},
  orange:         {l:'orange',                e:'🍊', v:[41.3,1.06,0.05,8.17], u:{n:'orange',g:130}},
  pear:           {l:'pear',                  e:'🍐', v:[50.9,0.37,0.3,10.0], u:{n:'pear',g:150}},
  kiwifruit:      {l:'kiwifruit',             e:'🥝', v:[55.9,0.73,0.57,10.7], u:{n:'kiwifruit',p:'kiwifruit',g:75}},

  /* afternoon-snack options — edam_snack is per packet via nominal 100 g unit */
  edam_snack:     {l:'Edam + rice crackers snack packet', e:'🧀', v:[125.5,6.6,5.94,11.35], u:{n:'Edam + rice crackers snack packet',p:'Edam + rice crackers snack packets',g:100,step:0.5,max:2}},
  biltong:        {l:'biltong / bitemeat',    e:'🥩', v:[315,58.0,7.9,2.7], max:60},
  chickpeas_roasted:{l:'roasted chickpeas',   e:'🫘', v:[320.3,22.4,5.0,38.7], max:60},
  mixed_nuts:     {l:'mixed nuts',            e:'🌰', v:[609.5,22.6,52.5,10.1], max:40},

  /* dessert options */
  choc_slab:      {l:'mini Whittakers slab',  e:'🍫', v:[520.8,7.6,30.6,56], u:{n:'mini Whittakers slab (15g)',p:'mini Whittakers slabs (15g)',g:15,step:0.5,max:2}},
  kefir:          {l:'kefir',                 e:'🥛', v:[48,3.5,2.1,3.8], max:250},

  /* breakfast + base-only foods — oats_seeds is per serve via nominal 100 g unit */
  oats_seeds:     {l:'oats + nuts/seeds',     e:'🥣', v:[189.4,6.6,8.02,20.14], u:{n:'serve of 35g oats + 12g nuts/seeds',p:'serves of 35g oats + 12g nuts/seeds',g:100,step:1,max:1}},
  muesli:         {l:'homemade muesli',       e:'🥣', v:[393.4,10.8,10.8,59.2], max:80},
  whey:           {l:'protein powder',        e:'💪', v:[372.8,78.8,4.1,4.2]},
  almond_milk:    {l:'almond milk',           e:'🥛', v:[17.0,0.54,1.4,0.2]},
  chobani_lite:   {l:'natural yoghurt (Chobani lite)', e:'🥛', v:[56,9.3,0.2,4.0]},
  blueberries:    {l:'frozen blueberries',    e:'🫐', v:[50.4,0.63,0.3,9.3]},
  salad:          {l:'salad',                 e:'🥗', v:[21.3,1.94,0.31,1.8]},
};

/* ---------- swap pools ----------
   b = what a swap must hold, as an index into [cal,P,F,C]: 0 calories,
   1 protein, 2 fat, 3 carbs. The guide's protein slot is protein-equivalent;
   its carb, fats, snack and dessert slots are calorie-slotted (it lists low
   carb wraps beside rice, and biltong beside nuts), so those match calories
   and show the macro differences honestly. */
const POOLS = {
  protein: {b:1, keys:['chicken_cooked','beef_cooked','pork_cooked','fish_cooked','prawns_cooked','tuna_oil']},
  carbs:   {b:0, keys:['rice_cooked','kumara_cooked','potato_cooked','pumpkin_cooked','pasta_cooked','pita_wholemeal','spinach_wrap','farrahs_tortilla']},
  fats:    {b:0, keys:['avocado','feta','mayo_lite']},
  fruit:   {b:3, keys:['banana','apple','mandarin','orange','pear','kiwifruit']},
  snackpack:{b:0, keys:['edam_snack','biltong','chickpeas_roasted','mixed_nuts']},
  dessert: {b:0, keys:['choc_slab','mandarin','kefir']},
  /* the guide's one breakfast alternative: "(or 40g homemade muesli)" for the
     oats + nuts/seeds pair — calorie-matched here, so it lands at 50g */
  bmuesli: {b:0, keys:['oats_seeds','muesli']},
};

/* ---------- swap maths (shared with evals.js — keep pure) ---------- */
const scaleV = (v,g) => v.map(x => x*g/100);
function ingAmountG(ing){
  if (ing.g != null) return ing.g;
  if (ing.ml != null) return ing.ml;
  return ing.u * FOODS[ing.k].u.g;
}
function ingMacros(ing){ return scaleV(FOODS[ing.k].v, ingAmountG(ing)); }
function mealMacros(meal){
  const t = [0,0,0,0];
  for (const ing of meal.ing){ const m = ingMacros(ing); for (let i=0;i<4;i++) t[i]+=m[i]; }
  return t;
}
function fmtU(u){
  const w = Math.floor(u), f = u - w;
  return (w ? w : '') + (f >= 0.25 ? '½' : '') || String(w);
}
function unitLabel(F, u){ return `${fmtU(u)} ${u > 1 ? (F.u.p || F.u.n + 's') : F.u.n}`; }
/* raw / dry weight, derived not guessed:
     meats — protein is conserved, so raw g = cooked g × cooked-protein ÷ rawP
     carbs — available-carb is conserved, so raw/dry g = cooked g × cooked-carb ÷ rawC
   Rounded to 5 g for larger weights, 1 g for the small dry-grain portions. */
function roundW(g){ return g >= 50 ? Math.round(g / 5) * 5 : Math.round(g); }
function rawGrams(k, cookedG){
  const F = FOODS[k];
  if (!F || F.rawP == null) return null;
  return roundW(cookedG * F.v[1] / F.rawP);
}
function dryGrams(k, cookedG){
  const F = FOODS[k];
  if (!F || F.rawC == null) return null;
  return roundW(cookedG * F.v[3] / F.rawC);
}
function rawTag(k, cookedG){
  const rm = rawGrams(k, cookedG);
  if (rm != null) return ` · ${rm}g raw`;
  const dc = dryGrams(k, cookedG);
  if (dc != null) return ` · ${dc}g ${FOODS[k].dry ? 'dry' : 'raw'}`;
  return '';
}
function ingLabel(ing){
  if (ing.t) return ing.t;
  const F = FOODS[ing.k];
  if (ing.u != null) return unitLabel(F, ing.u);
  if (ing.ml != null) return `${ing.ml}ml ${F.l}`;
  return `${ing.g}g ${F.l}${rawTag(ing.k, ing.g)}`;
}
/* A swap qualifies when its re-portioned amount lands within 10% of the base
   ingredient's pool measure after rounding to a weighable portion (flat 10% —
   no extra headroom), and stays a portion someone would actually serve. */
function computeSwaps(ing){
  const pool = POOLS[ing.pool];
  if (!pool) return [];
  const base = ingMacros(ing), target = base[pool.b];
  if (!target) return [];
  const out = [];
  for (const k of pool.keys){
    if (k === ing.k) continue;
    const F = FOODS[k], per = F.v[pool.b];
    if (!per) continue;
    const need = target / per * 100;
    let g, label;
    if (F.u){
      const step = F.u.step || 0.5;
      let u = Math.round(need / F.u.g / step) * step;
      if (F.u.min && u < F.u.min) u = F.u.min;
      if (u < step) u = step;
      if (u > (F.u.max || 8)) continue;
      g = u * F.u.g; label = unitLabel(F, u);
    } else if (F.ml){
      const ml = Math.round(need / 50) * 50;
      if (ml < 50 || ml > (F.max || 600)) continue;
      g = ml; label = `${ml}ml ${F.l}`;
    } else {
      g = need < 20 ? Math.round(need) : Math.round(need / 5) * 5;
      if (g < 5 || g > (F.max || 400)) continue;
      label = `${g}g ${F.l}${rawTag(k, g)}`;
    }
    const m = scaleV(F.v, g);
    if (Math.abs(m[pool.b] - target) / target > 0.10) continue;
    out.push({k, e:F.e, label, m, d:m.map((x,i)=>x-base[i])});
  }
  return out;
}

/* ---------- meals — the guide's plan, as written (single day) ---------- */
const MEALS = [
  {type:'pre', title:'Pre-Gym', ing:[
    {k:'banana', u:1, pool:'fruit'}]},
  {type:'breakfast', title:'Breakfast', folded:true, ing:[
    {k:'oats_seeds', u:1, t:'35g rolled oats + 1 Tbsp (12g) nuts/seeds', pool:'bmuesli'},
    {k:'almond_milk', ml:200, t:'unsweetened almond milk'},
    {k:'whey', g:30, t:'30g protein powder'},
    {k:'chobani_lite', g:120, t:'120g natural yoghurt (Chobani lite)'},
    {k:'blueberries', g:100, t:'100g frozen blueberries'}]},
  {type:'snack', title:'Snack', ing:[
    {k:'apple', u:1, pool:'fruit'}]},
  {type:'lunch', title:'Lunch', ing:[
    {k:'chicken_cooked', g:120, pool:'protein'},
    {k:'rice_cooked', g:80, pool:'carbs'},
    {k:'salad', g:140, t:'2 cups salad / vegetables'},
    {k:'avocado', g:50, t:'¼ avocado (50g)', pool:'fats'}]},
  {type:'snack', title:'Snack', ing:[
    {k:'apple', u:1, pool:'fruit'},
    {k:'edam_snack', u:1, pool:'snackpack'}]},
  {type:'dinner', title:'Dinner', ing:[
    {k:'chicken_cooked', g:120, pool:'protein'},
    {k:'kumara_cooked', g:150, pool:'carbs'},
    {k:'salad', g:140, t:'2 cups salad / vegetables'},
    {k:'avocado', g:50, t:'¼ avocado (50g)', pool:'fats'}]},
  {type:'dessert', title:'Dessert', ing:[
    {k:'choc_slab', u:1, pool:'dessert'}]},
];

/* ---------- presentation ---------- */
const STYLE = {
  pre:      {em:"☕", bg:"#FCF2D3", fg:"#082B35"},
  breakfast:{em:"🥣", bg:"#E0F3F7", fg:"#082B35"},
  snack:    {em:"🍎", bg:"#FDEEEB", fg:"#082B35"},
  lunch:    {em:"🍽️", bg:"#DDECC6", fg:"#082B35"},
  dinner:   {em:"🌙", bg:"#F9EAE7", fg:"#082B35"},
  dessert:  {em:"🍫", bg:"#FBF2D5", fg:"#082B35"},
};
const BASIS_NAME = {0:'same calories', 1:'same protein', 2:'same fat', 3:'same carbs'};

const statsEl=document.getElementById('stats');
const mealsEl=document.getElementById('meals');
const footEl=document.getElementById('foot');

const R = x => Math.round(x);
function macroLine(m){
  return `<span class="m-cal">${R(m[0])} cal</span> · <span class="m-pro">${R(m[1])}g P</span> · <span class="m-fat">${R(m[2])}g F</span> · <span class="m-carb">${R(m[3])}g C</span>`;
}
function ingSub(m){
  return `${R(m[0])} cal · ${R(m[1])}P · ${R(m[2])}F · ${R(m[3])}C`;
}
function deltaLine(swap, basis){
  const DEF = [[0,'m-cal','cal',''],[1,'m-pro','P','g '],[2,'m-fat','F','g '],[3,'m-carb','C','g ']];
  const parts = [];
  const [bi, bcls, bltr, bunit] = DEF[basis];
  const db = R(swap.d[basis]);
  parts.push(`<span class="${bcls}">${Math.abs(db) < 1 ? '=' : (db > 0 ? '+' : '−') + Math.abs(db) + bunit}${bltr}</span>`);
  for (const [i, cls, ltr, unit] of DEF){
    if (i === basis) continue;
    const d = R(swap.d[i]);
    const min = i === 0 ? 5 : 1;
    if (Math.abs(d) < min) continue;
    parts.push(`<span class="${cls}">${d > 0 ? '+' : '−'}${Math.abs(d)}${unit}${ltr}</span>`);
  }
  return parts.length > 1 || Math.abs(db) >= 1 ? parts.join(' · ') : parts[0] + ' · near-exact match';
}

function render(){
  statsEl.innerHTML = `
    <div class="stat cal"><b>~${TARGETS.cal}</b><span>cal</span></div>
    <div class="stat pro"><b>${TARGETS.p}g</b><span>protein</span></div>
    <div class="stat fat"><b>${TARGETS.f}g</b><span>fat</span></div>
    <div class="stat carb"><b>${TARGETS.c}g</b><span>carbs</span></div>`;
  mealsEl.innerHTML = MEALS.map((meal, mi)=>{
    const s = STYLE[meal.type];
    const mm = mealMacros(meal);
    if (meal.folded){
      const fSwaps = meal.ing.filter(i=>i.pool).map(ing=>({ing, swaps:computeSwaps(ing)})).filter(x=>x.swaps.length);
      const badge = fSwaps.length ? `<span class="badge">${fSwaps.length} swappable</span>`
                                  : `<span class="badge none">as planned</span>`;
      const swapHtml = fSwaps.length ? `<div class="fold-swaps">${fSwaps.map(({ing, swaps})=>
          `<div class="swaps-label">Swap for — ${BASIS_NAME[POOLS[ing.pool].b]} — instead of ${ingLabel(ing)}</div>${
          swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
            <div class="swap-name">${sw.label}</div>
            <div class="swap-d">${deltaLine(sw, POOLS[ing.pool].b)}</div></div></div>`).join('')}`).join('')
        }</div>` : '';
      return `<div class="meal ${fSwaps.length?'swappable':''}">
        <div class="meal-head">
          <div class="icon" style="background:${s.bg};color:${s.fg}">${s.em}</div>
          <div class="meal-body">
            <div class="meal-kicker"><span class="name">${meal.title}</span>${badge}</div>
            <div class="items">${meal.ing.map(ingLabel).join(' + ')}</div>
            <div class="macros">${macroLine(mm)}</div>
          </div>
          ${fSwaps.length?'<div class="chev">▼</div>':''}
        </div>${swapHtml}</div>`;
    }
    const rows = meal.ing.map((ing, ii)=>{
      const F = FOODS[ing.k];
      const swaps = ing.pool ? computeSwaps(ing) : [];
      const swappable = swaps.length > 0;
      const swapHtml = swappable ? `<div class="swaps">
          <div class="swaps-label">Swap for — ${BASIS_NAME[POOLS[ing.pool].b]}</div>${
          swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
            <div class="swap-name">${sw.label}</div>
            <div class="swap-d">${deltaLine(sw, POOLS[ing.pool].b)}</div></div></div>`).join('')
        }</div>` : '';
      return `<div class="ing ${swappable?'swappable':''}" data-m="${mi}" data-i="${ii}">
        <div class="ing-line">
          <div class="ing-em">${F.e}</div>
          <div class="ing-txt">
            <div class="ing-name">${ingLabel(ing)}</div>
            <div class="ing-sub">${ingSub(ingMacros(ing))}</div>
          </div>
          ${swappable?'<div class="chev">▼</div>':''}
        </div>${swapHtml}</div>`;
    }).join('');
    const nSwap = meal.ing.filter(i=>i.pool && computeSwaps(i).length).length;
    const badge = nSwap ? `<span class="badge">${nSwap} swappable</span>`
                        : `<span class="badge none">as planned</span>`;
    return `<div class="meal">
      <div class="meal-head">
        <div class="icon" style="background:${s.bg};color:${s.fg}">${s.em}</div>
        <div class="meal-body">
          <div class="meal-kicker"><span class="name">${meal.title}</span>${badge}</div>
          <div class="macros">${macroLine(mm)}</div>
        </div>
      </div>
      <div class="ings">${rows}</div></div>`;
  }).join('');

  mealsEl.querySelectorAll('.ing.swappable .ing-line').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });
  mealsEl.querySelectorAll('.meal.swappable .meal-head').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });

  footEl.innerHTML = `<img class="n8mark" src="nomad-logo.png" alt="Nomad8">
    All data from the NZ Food Composition Database unless it's a specific brand<br>
    <span style="opacity:.6">v${APP_VERSION}</span>`;
}

render();

/* ---------- auto-update: fetch fresh version, reload if stale (offline-safe) ---------- */
(async function checkForUpdate(){
  try{
    const res=await fetch('version.txt?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const latest=(await res.text()).trim();
    if(latest && latest!==APP_VERSION && !sessionStorage.getItem('bv_reloaded')){
      sessionStorage.setItem('bv_reloaded','1');
      location.replace(location.pathname+'?v='+encodeURIComponent(latest));
    }
  }catch(e){ /* offline — keep working with the cached copy */ }
})();
</script>
</body>
</html>
